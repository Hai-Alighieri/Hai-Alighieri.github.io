---
layout: page
title: 标签
permalink: /tags.html
---
<h1>标签</h1>
{% for tag in site.tags %}
<h2 id="{{ tag[0] }}">{{ tag[0] }}</h2>
<ul>
  {% for post in tag[1] %}
  <li><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a> <span class="muted">({{ post.date | date: "%Y-%m-%d" }})</span></li>
  {% endfor %}
</ul>
{% endfor %}
