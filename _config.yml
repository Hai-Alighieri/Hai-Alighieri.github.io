# ===== 评论（giscus：用 GitHub Discussions，免费无广告）=====
# 配置三步：
#   1. 仓库 Settings → 勾选 Discussions
#   2. 安装 giscus app：https://github.com/apps/giscus
#   3. 打开 https://giscus.app 填好仓库，把生成的 id 填到下面
comments: true
giscus_repo: Hai-Alighieri/Hai-Alighieri.github.io
giscus_repo_id: ""            # 填 giscus 生成的 data-repo-id
giscus_category: General
